<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Águia: aplicação web com React, Vite, Tailwind e Flask." />
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph / redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Águia" />
    <meta property="og:description" content="Águia: aplicação web com React, Vite, Tailwind e Flask." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://aguia.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Águia</title>
  </head>
  <body>
    <script>
      // Aplica o tema antes da hidratação para evitar "flash" de tema claro.
      try {
        const stored = JSON.parse(localStorage.getItem('theme'))
        const dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {
        // Sem acesso ao localStorage: mantém o padrão.
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
